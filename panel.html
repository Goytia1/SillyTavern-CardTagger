<div id="ct_panel" class="ct-panel" hidden>
    <div class="ct-panel-card">
        <div class="ct-panel-head">
            <div class="ct-panel-title">
                <span class="fa-solid fa-tags"></span>
                <span>角色卡批量打标签</span>
            </div>
            <div class="ct-panel-head-actions">
                <span id="ct_summary" class="ct-summary"></span>
                <button type="button" id="ct_close_panel" class="ct-btn ct-btn-icon" title="关闭">
                    <span class="fa-solid fa-xmark"></span>
                </button>
            </div>
        </div>

        <div class="ct-toolbar">
            <div class="ct-toolbar-group">
                <label class="ct-label-inline">范围</label>
                <select id="ct_scope" class="ct-select">
                    <option value="all">全部角色</option>
                    <option value="untagged">还没打过本地标签的</option>
                    <option value="keyword">按关键字筛选</option>
                    <option value="filtered">当前 ST 搜索/筛选结果</option>
                </select>
                <input type="text" id="ct_scope_keyword" class="ct-select ct-keyword-input"
                    placeholder="关键字，匹配角色名与标签" hidden />
                <span id="ct_scope_count" class="ct-hint"></span>
            </div>

            <div class="ct-toolbar-group ct-toolbar-grow">
                <button type="button" id="ct_start" class="ct-btn ct-btn-primary">
                    <span class="fa-solid fa-wand-magic-sparkles"></span> 开始分析
                </button>
                <button type="button" id="ct_abort" class="ct-btn ct-btn-danger" hidden>
                    <span class="fa-solid fa-stop"></span> 中断
                </button>
                <button type="button" id="ct_retry_failed" class="ct-btn" hidden>
                    <span class="fa-solid fa-rotate-right"></span> 重试失败项
                </button>
            </div>

            <div class="ct-toolbar-group">
                <button type="button" id="ct_select_all" class="ct-btn ct-btn-ghost">全选</button>
                <button type="button" id="ct_select_none" class="ct-btn ct-btn-ghost">全不选</button>
                <button type="button" id="ct_select_new" class="ct-btn ct-btn-ghost">只看新建标签</button>
            </div>
        </div>

        <div id="ct_progress_wrap" class="ct-progress-wrap" hidden>
            <div class="ct-progress-bar"><div id="ct_progress_fill" class="ct-progress-fill"></div></div>
            <div id="ct_progress_text" class="ct-progress-text"></div>
        </div>

        <div id="ct_result_wrap" class="ct-result-wrap">
            <div id="ct_empty_state" class="ct-empty">
                <div class="fa-solid fa-tags ct-empty-icon"></div>
                <div>选好范围，点「开始分析」。</div>
                <div class="ct-hint">AI 只会读取你勾的那几个字段，不会看聊天记录，也不会改动任何东西 —— 直到你按下「应用」。</div>
            </div>
            <table id="ct_result_table" class="ct-table" hidden>
                <thead>
                    <tr>
                        <th class="ct-col-check"></th>
                        <th class="ct-col-name">角色</th>
                        <th class="ct-col-tags">AI 建议的标签</th>
                        <th class="ct-col-status">状态</th>
                    </tr>
                </thead>
                <tbody id="ct_result_body"></tbody>
            </table>
        </div>

        <div class="ct-footer">
            <div id="ct_footer_stats" class="ct-footer-stats"></div>
            <div class="ct-footer-actions">
                <button type="button" id="ct_apply_local" class="ct-btn ct-btn-primary" disabled>
                    <span class="fa-solid fa-check"></span> 应用到本地标签
                </button>
                <button type="button" id="ct_apply_card" class="ct-btn" disabled>
                    <span class="fa-solid fa-file-import"></span> 回填卡片
                </button>
                <button type="button" id="ct_export" class="ct-btn ct-btn-ghost">
                    <span class="fa-solid fa-download"></span> 导出结果
                </button>
            </div>
        </div>
    </div>
</div>
